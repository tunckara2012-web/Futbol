<script>
window.addEventListener('error',function(e){var d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#b71c1c;color:#fff;margin:0;padding:8px;font:12px monospace;white-space:pre-wrap';document.body.appendChild(d)}d.textContent+=(e.message||'hata')+' (satir '+(e.lineno||'?')+')\n'});

<noscript><p style="color:#fff">JavaScript kapalı, oyun açılamaz.</p></noscript>
<canvas id="c"></canvas><div id="hud"></div><div id="ban"></div><div id="zone"></div>
<div class="j" id="jr"></div><div class="j" id="jk"></div>
<div id="btns"><button class="b" id="bw">DEĞİŞ</button><button class="b" id="bp">PAS</button><button class="b" id="bs">ŞUT</button></div>
<div id="ov"></div><div id="rot">Telefonu yan çevir ↻</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const W=1100,H=700,PX=50,PY=50,PW=1000,PH=600,GH=85,SPD=200,PR=15,BR=8,CY=350;
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let k=1,ox=0,oy=0,dpr=1;
function rs(){dpr=devicePixelRatio||1;const w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;k=Math.min(w/W,h/H);ox=(w-W*k)/2;oy=(h-H*k)/2}
addEventListener('resize',rs);rs();
let cfg={m:'t',v:5},role=0,tr=0,run=0,peer=null,conn=null,code='',lobS='';
let st='dead',P=[],ball={x:550,y:350,vx:0,vy:0},sc=[0,0],clock=0,ctrl=[7,15],ch=[0,0],prev=[0,0],cd=[0,0];
let last=0,ko=0,dead=0,gt=0,banner='',banT=0,rt='',es=0;
let L={mx:0,my:0,sh:0,pass:0,sw:0},I1={mx:0,my:0,sh:0,pass:0,sw:0},pc=0,sw=0,lpc=0,lsw=0,snap=null,sv=null;
const HA=[[80,350],[200,200],[200,350],[200,500],[360,170],[360,350],[360,530],[500,350]];
function init(){P=[];for(let t=0;t<2;t++)for(let i=0;i<8;i++){const h=HA[i],x=t?1100-h[0]:h[0];P.push({t,i,x,y:h[1],vx:0,vy:0,hx:x,hy:h[1],fx:t?-1:1,fy:0})}ctrl=[7,15];ch=[0,0]}
function say(s,sec){banner=s;banT=performance.now()+sec*1000}
function kickoff(t){P.forEach(p=>{p.x=p.hx;p.y=p.hy;p.vx=p.vy=0});ball.x=550;ball.y=350;ball.vx=ball.vy=0;ctrl=[7,15];const q=P[t?15:7];q.x=550+(t?28:-28);q.y=350;st='dead';dead=1.1;last=t;say('Başla!',1)}
function restart(t,x,y,gk){ball.x=x;ball.y=y;ball.vx=ball.vy=0;let b=null,bd=1e9;
 P.forEach(p=>{if(p.t==t&&(gk?p.i==0:p.i>0)){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}});
 const dx=550-x,dy=350-y,d=Math.hypot(dx,dy)||1;b.x=x+dx/d*28;b.y=y+dy/d*28;b.vx=b.vy=0;if(b.i>0)ctrl[t]=b.t*8+b.i;
 P.forEach(p=>{if(p.t!=t){const e=Math.hypot(p.x-x,p.y-y)||1;if(e<110){p.x=x+(p.x-x)/e*110;p.y=y+(p.y-y)/e*110}}});
 st='dead';dead=.9;last=t}
function goal(t){sc[t]++;st='goal';gt=2.3;ko=1-t;say('GOL!  '+sc[0]+' - '+sc[1],2.3)}
function fin(){st='end';const a=sc[0],b=sc[1];rt=a==b?'Berabere!':(a>b?'Mavi kazandı!':'Kırmızı kazandı!');say(rt,1e5)}
function chk(){const b=ball;
 if(b.y<PY||b.y>PY+PH){restart(1-last,Math.max(70,Math.min(1030,b.x)),b.y<PY?PY:PY+PH,0);say('Aut',.8);return}
 if(b.x<PX||b.x>PX+PW){const lf=b.x<PX;if(Math.abs(b.y-CY)<GH){goal(lf?1:0);return}
  const d=lf?0:1;if(last==d){restart(1-d,lf?PX:PX+PW,b.y<CY?PY:PY+PH,0);say('Korner',.8)}else{restart(d,lf?110:990,CY,1);say('Kale vuruşu',.8)}}}
function near(t,ex){let r=-1,bd=1e9;for(let i=1;i<8;i++){const q=t*8+i;if(q==ex)continue;const d=Math.hypot(P[q].x-ball.x,P[q].y-ball.y);if(d<bd){bd=d;r=q}}return r}
function kick(p,pw){if(Math.hypot(ball.x-p.x,ball.y-p.y)>PR+BR+18)return;if(st=='dead')st='play';
 let dx=p.fx,dy=p.fy;const gx=p.t?PX:PX+PW,gd=Math.hypot(gx-p.x,CY-p.y)||1,ux=(gx-p.x)/gd,uy=(CY-p.y)/gd;
 if(dx*ux+dy*uy>.85){dx=dx*.5+ux*.5;dy=dy*.5+uy*.5;const n=Math.hypot(dx,dy);dx/=n;dy/=n}
 const s=380+620*pw;ball.vx=dx*s;ball.vy=dy*s;last=p.t}
function pass(p){if(Math.hypot(ball.x-p.x,ball.y-p.y)>PR+BR+18)return;if(st=='dead')st='play';
 let b=null,bs=-9;P.forEach(q=>{if(q.t==p.t&&q!==p&&q.i>0){const vx=q.x-p.x,vy=q.y-p.y,dd=Math.hypot(vx,vy)||1,dn=(vx*p.fx+vy*p.fy)/dd;if(dn>.5){const s=dn-dd/1500;if(s>bs){bs=s;b=q}}}});
 let ux=p.fx,uy=p.fy,sp=380;
 if(b){const vx=b.x+b.vx*.3-p.x,vy=b.y+b.vy*.3-p.y,dd=Math.hypot(vx,vy)||1;ux=vx/dd;uy=vy/dd;sp=Math.min(780,dd*2.2+170);ctrl[p.t]=p.t*8+b.i}
 ball.vx=ux*sp;ball.vy=uy*sp;last=p.t}
function ctl(t,dt){const I=t?I1:L,c=P[ctrl[t]],m=Math.hypot(I.mx,I.my);let tx=0,ty=0;
 if(m>.15){const s=Math.min(1,m);tx=I.mx/m*SPD*s;ty=I.my/m*SPD*s;c.fx=I.mx/m;c.fy=I.my/m}
 const a=Math.min(1,dt*10);c.vx+=(tx-c.vx)*a;c.vy+=(ty-c.vy)*a;
 if(I.sh)ch[t]=Math.min(1,ch[t]+dt/.8);else if(prev[t]){kick(c,ch[t]);ch[t]=0}
 prev[t]=I.sh;
 if(I.pass){I.pass=0;pass(P[ctrl[t]])}
 if(I.sw){I.sw=0;ctrl[t]=near(t,ctrl[t]);cd[t]=.5}
 else{cd[t]-=dt;const n=near(t,-1),d1=Math.hypot(c.x-ball.x,c.y-ball.y);
  if(n!=ctrl[t]&&cd[t]<=0&&d1>120&&d1-Math.hypot(P[n].x-ball.x,P[n].y-ball.y)>60){ctrl[t]=n;cd[t]=.5}}}
function ai(dt){for(let t=0;t<2;t++){let c2=-1,bd=1e9;
 for(let i=1;i<8;i++){const q=t*8+i;if(q==ctrl[t])continue;const d=Math.hypot(P[q].x-ball.x,P[q].y-ball.y);if(d<bd){bd=d;c2=q}}
 const cdist=Math.hypot(P[ctrl[t]].x-ball.x,P[ctrl[t]].y-ball.y);
 for(let i=0;i<8;i++){const q=t*8+i;if(q==ctrl[t])continue;const p=P[q];let tx,ty,sp=SPD*.8;
  if(i==0){const gx=t?1015:85;tx=gx;ty=Math.max(CY-70,Math.min(CY+70,ball.y));const d=Math.hypot(ball.x-gx,ball.y-CY);if(d<170){tx=gx+(t?-1:1)*Math.min(60,d*.4);ty=ball.y}}
  else if(q==c2&&bd<300&&cdist>50){tx=ball.x;ty=ball.y;sp=SPD*.9}
  else{tx=p.hx+(ball.x-550)*.4;ty=p.hy+(ball.y-CY)*.3}
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),s=Math.min(sp,d*4),vx=d>2?dx/d*s:0,vy=d>2?dy/d*s:0,a=Math.min(1,dt*8);
  p.vx+=(vx-p.vx)*a;p.vy+=(vy-p.vy)*a}}}
function phys(dt){
 P.forEach(p=>{p.x=Math.max(PX+PR,Math.min(PX+PW-PR,p.x+p.vx*dt));p.y=Math.max(PY+PR,Math.min(PY+PH-PR,p.y+p.vy*dt))});
 for(let a=0;a<16;a++)for(let b=a+1;b<16;b++){const p=P[a],q=P[b],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
  if(d<PR*2&&d>.01){const o=(PR*2-d)/2,nx=dx/d,ny=dy/d;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o}}
 if(st=='play')P.forEach(p=>{const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
  if(d<PR+BR&&d>.01){const nx=dx/d,ny=dy/d;ball.x=p.x+nx*(PR+BR);ball.y=p.y+ny*(PR+BR);
   const vr=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;
   if(p.i==0){const tx=550-p.x,ty=(Math.random()-.5)*300,n=Math.hypot(tx,ty);ball.vx=tx/n*560;ball.vy=ty/n*560}
   else if(vr<0){ball.vx-=1.35*vr*nx;ball.vy-=1.35*vr*ny}
   last=p.t}})}
function bmove(dt,ig){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const f=Math.pow(.42,dt);ball.vx*=f;ball.vy*=f;
 if(ig){ball.x=Math.max(16,Math.min(1084,ball.x));ball.y=Math.max(CY-GH,Math.min(CY+GH,ball.y))}}
function step(dt){
 if(st=='goal'){bmove(dt,1);gt-=dt;if(gt<=0){if(cfg.m=='g'&&Math.max(sc[0],sc[1])>=cfg.v)fin();else kickoff(ko)}return}
 if(st=='end')return;
 clock+=cfg.m=='t'?-dt:dt;
 if(cfg.m=='t'&&clock<=0&&st=='play'){clock=0;fin();return}
 if(st=='dead'){dead-=dt;if(dead<=0)st='play'}
 ctl(0,dt);ctl(1,dt);ai(dt);phys(dt);
 if(st=='play'){bmove(dt);chk()}}
function view(){return{p:P.flatMap(p=>[p.x,p.y]),b:[ball.x,ball.y],c:ctrl,h:ch,s:sc,t:clock,m:performance.now()<banT?banner:'',e:rt,st}}
function mk(){const v=view();v.p=v.p.map(Math.round);v.b=v.b.map(Math.round);v.h=v.h.map(x=>+x.toFixed(2));return v}
function draw(v){
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
 g.setTransform(dpr*k,0,0,dpr*k,dpr*ox,dpr*oy);g.save();
 if(role){g.translate(W,H);g.scale(-1,-1)}
 g.fillStyle='#1d5524';g.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){g.fillStyle=i%2?'#2e7d32':'#35893a';g.fillRect(PX+i*100,PY,100,PH)}
 g.strokeStyle='#ffffffd0';g.lineWidth=3;g.strokeRect(PX,PY,PW,PH);
 g.beginPath();g.moveTo(550,PY);g.lineTo(550,PY+PH);g.stroke();
 g.beginPath();g.arc(550,CY,70,0,7);g.stroke();
 g.strokeRect(PX,CY-150,150,300);g.strokeRect(PX+PW-150,CY-150,150,300);
 g.strokeRect(PX,CY-60,55,120);g.strokeRect(PX+PW-55,CY-60,55,120);
 g.fillStyle='#ffffff30';g.fillRect(PX-36,CY-GH,36,GH*2);g.fillRect(PX+PW,CY-GH,36,GH*2);
 g.strokeRect(PX-36,CY-GH,36,GH*2);g.strokeRect(PX+PW,CY-GH,36,GH*2);
 for(let i=0;i<16;i++){const t=i>>3,x=v.p[i*2],y=v.p[i*2+1],gk=i%8==0;
  g.beginPath();g.arc(x,y+3,PR,0,7);g.fillStyle='#0004';g.fill();
  g.beginPath();g.arc(x,y,PR,0,7);g.fillStyle=gk?'#ffeb3b':(t?'#e53935':'#1e88e5');g.fill();
  g.lineWidth=3;g.strokeStyle=t?'#7f0000':'#0d3c7a';g.stroke();
  if(v.c[t]==i){g.beginPath();g.arc(x,y,PR+6,0,7);g.strokeStyle=t==role?'#fff':'#ffffff60';g.lineWidth=3;g.stroke();
   if(v.h[t]>0){g.fillStyle='#0008';g.fillRect(x-20,y-34,40,6);g.fillStyle='#ffca28';g.fillRect(x-20,y-34,40*v.h[t],6)}}}
 g.beginPath();g.arc(v.b[0],v.b[1],BR,0,7);g.fillStyle='#fff';g.fill();g.lineWidth=2;g.strokeStyle='#111';g.stroke();
 g.restore()}
function hud(v){const tt=Math.max(0,Math.floor(v.t)),ts=String(Math.floor(tt/60)).padStart(2,'0')+':'+String(tt%60).padStart(2,'0');
 $('hud').innerHTML='<span style="color:#64b5f6">Mavi '+v.s[0]+'</span> - <span style="color:#ff8a80">'+v.s[1]+' Kırmızı</span> &nbsp;'+ts+
  '<small>Sen: '+(role?'Kırmızı':'Mavi')+(cfg.m=='g'?' · İlk '+cfg.v+' gol':'')+'</small>';
 $('ban').textContent=v.m;
 if(v.st=='end'&&!es){es=1;ov('<h2>'+(v.e||rt)+'</h2><p>Mavi '+v.s[0]+' - '+v.s[1]+' Kırmızı</p>'+(role?'<p>Host tekrar başlatabilir</p>':'<button onclick="go()">Tekrar oyna</button>')+'<button onclick="location.reload()">Menü</button>')}
 else if(v.st!='end')es=0}
let lt=0,fr=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.1,(ts-lt)/1000||0);lt=ts;if(!run)return;
 if(!role){const n=Math.ceil(dt/.02)||1;for(let i=0;i<n;i++)step(dt/n);const v=view();draw(v);hud(v);if(conn&&conn.open&&++fr%2==0)conn.send(mk())}
 else if(snap){if(!sv)sv={p:snap.p.slice(),b:snap.b.slice()};
  for(let i=0;i<32;i++){const d=snap.p[i]-sv.p[i];sv.p[i]=Math.abs(d)>150?snap.p[i]:sv.p[i]+d*.4}
  for(let i=0;i<2;i++){const d=snap.b[i]-sv.b[i];sv.b[i]=Math.abs(d)>150?snap.b[i]:sv.b[i]+d*.5}
  sv.c=snap.c;sv.h=snap.h;sv.s=snap.s;sv.t=snap.t;sv.m=snap.m;sv.e=snap.e;sv.st=snap.st;draw(sv);hud(sv)}}
requestAnimationFrame(loop);
function ov(h){const o=$('ov');o.style.display=h?'flex':'none';o.innerHTML=h||''}
function menu(){run=0;es=0;if(peer)peer.destroy();peer=conn=null;role=0;tr=0;$('hud').innerHTML='';$('ban').textContent='';
 ov('<h1>⚽ Mini Futbol 8v8</h1><button onclick="mkRoom()">Oda kur</button><div><input id="ci" maxlength="4" placeholder="Kod"><button onclick="joinR()">Odaya gir</button></div><button onclick="train()">Antrenman</button>')}
function opts(){return '<div>'+['t','g'].map(m=>'<button class="'+(cfg.m==m?'on':'')+'" onclick="sc2(\''+m+'\','+cfg.v+')">'+(m=='t'?'Süreli (dk)':'Gollü')+'</button>').join('')+'</div><div>'+
 [3,5,8].map(v=>'<button class="'+(cfg.v==v?'on':'')+'" onclick="sc2(\''+cfg.m+'\','+v+')">'+v+'</button>').join('')+'</div>'}
function sc2(m,v){cfg.m=m;cfg.v=v;lobby()}
function lobby(){const ok=tr||(conn&&conn.open);ov((code?'<h2>Oda kodu: <b style="font-size:38px">'+code+'</b></h2>':'<h2>Antrenman</h2>')+'<p>'+lobS+'</p>'+opts()+'<button '+(ok?'':'disabled')+' onclick="go()">Başlat</button><button onclick="menu()">Geri</button>')}
function train(){role=0;tr=1;code='';lobS='Rakip hareketsiz durur, serbestçe dene';lobby()}
function mkRoom(){role=0;tr=0;if(typeof Peer=='undefined'){lobS='PeerJS yüklenemedi (internet?)';code='';return lobby()}
 code=Math.random().toString(36).slice(2,6).toUpperCase();lobS='Rakip bekleniyor...';lobby();
 if(peer)peer.destroy();peer=new Peer('fkoy8-'+code);
 peer.on('error',e=>{if(e.type=='unavailable-id')mkRoom();else{lobS='Hata: '+e.type;lobby()}});
 peer.on('connection',c=>{conn=c;c.on('open',()=>{lobS='Rakip bağlandı!';lobby()});
  c.on('data',d=>{if(d.i){I1.mx=d.i[0];I1.my=d.i[1];I1.sh=d.i[2];if(d.pc>lpc){I1.pass=1;lpc=d.pc}if(d.sw>lsw){I1.sw=1;lsw=d.sw}}});
  c.on('close',()=>{lobS='Rakip ayrıldı';conn=null;if(run){run=0}lobby()})})}
function joinR(){const c=$('ci').value.trim().toUpperCase();if(c.length<4)return;role=1;
 if(typeof Peer=='undefined'){ov('<h2>PeerJS yüklenemedi</h2><button onclick="menu()">Geri</button>');return}
 ov('<h2>Bağlanıyor...</h2>');peer=new Peer();
 peer.on('error',e=>ov('<h2>Bağlanılamadı ('+e.type+')</h2><button onclick="menu()">Geri</button>'));
 peer.on('open',()=>{conn=peer.connect('fkoy8-'+c,{reliable:true});
  conn.on('open',()=>ov('<h2>Bağlandı ✔</h2><p>Host maçı başlatınca oyun açılır</p>'));
  conn.on('data',d=>{if(d.go){cfg=d.go;run=1;snap=null;sv=null;es=0;ov('')}else if(d.p)snap=d});
  conn.on('close',()=>{run=0;ov('<h2>Bağlantı koptu</h2><button onclick="menu()">Menü</button>')})})}
function go(){init();sc=[0,0];clock=cfg.m=='t'?cfg.v*60:0;rt='';es=0;ov('');run=1;kickoff(0);if(conn&&conn.open)conn.send({go:cfg})}
setInterval(()=>{if(role&&conn&&conn.open&&run)conn.send({i:[-L.mx,-L.my,L.sh?1:0],pc,sw})},33);
const zn=$('zone'),jr=$('jr'),jk=$('jk');let jid=null,jo=null;
function pl(e,x,y){e.style.left=x+'px';e.style.top=y+'px'}
zn.onpointerdown=e=>{if(jid!=null)return;jid=e.pointerId;zn.setPointerCapture(jid);jo=[e.clientX,e.clientY];pl(jr,...jo);pl(jk,...jo);jr.style.display=jk.style.display='block'};
zn.onpointermove=e=>{if(e.pointerId!=jid)return;let dx=e.clientX-jo[0],dy=e.clientY-jo[1];const d=Math.hypot(dx,dy),r=55;if(d>r){dx*=r/d;dy*=r/d}L.mx=dx/r;L.my=dy/r;pl(jk,jo[0]+dx,jo[1]+dy)};
zn.onpointerup=zn.onpointercancel=e=>{if(e.pointerId==jid){jid=null;L.mx=L.my=0;jr.style.display=jk.style.display='none'}};
function hold(el,f){el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);f(1)};el.onpointerup=el.onpointercancel=()=>f(0)}
hold($('bs'),v=>L.sh=v);
hold($('bp'),v=>{if(v){if(role)pc++;else L.pass=1}});
hold($('bw'),v=>{if(v){if(role)sw++;else L.sw=1}});
const K={};
function kb(){if(jid!=null)return;L.mx=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0);L.my=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0)}
onkeydown=e=>{K[e.code]=1;if(e.code=='Space')L.sh=1;if(e.code=='KeyE'){if(role)pc++;else L.pass=1}if(e.code=='KeyQ'){if(role)sw++;else L.sw=1}kb()};
onkeyup=e=>{K[e.code]=0;if(e.code=='Space')L.sh=0;kb()};
init();menu();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
