<script>
const W=1100,H=700,PX=50,PY=50,PW=1000,PH=600,GH=85,SPD=200,PR=15,BR=8,CY=350;
const $=id=>document.getElementById(id),cv=$('c');
let R=null,sc3,cam;
function rs(){if(!R)return;R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);
let cfg={m:'t',v:5},role=0,tr=0,run=0,peer=null,conn=null,code='',lobS='';
let st='dead',P=[],ball={x:550,y:350,vx:0,vy:0},sc=[0,0],clock=0,ctrl=[7,15],ch=[0,0],prev=[0,0],cd=[0,0];
let last=0,ko=0,dead=0,gt=0,banner='',banT=0,rt='',es=0,own=-1,prot=0,gkT=0,lm='',ngr=new Array(16).fill(0);
let L={mx:0,my:0,sh:0,pass:0,sw:0,sl:0},I1={mx:0,my:0,sh:0,pass:0,sw:0,sl:0},pc=0,sw=0,lpc=0,lsw=0,skc=0,lsk=0,snap=null,sv=null;
const HA=[[80,350],[200,200],[200,350],[200,500],[360,170],[360,350],[360,530],[500,350]];
const COL=['#1e88e5','#e53935','#fafafa','#fb8c00','#8e24aa','#212121','#00bcd4'];
const FM={'3-3-1':[[200,200],[200,350],[200,500],[360,170],[360,350],[360,530],[500,350]],'2-3-2':[[210,230],[210,470],[370,170],[370,350],[370,530],[500,250],[500,450]],'3-2-2':[[200,200],[200,350],[200,500],[360,260],[360,440],[500,250],[500,450]],'2-4-1':[[210,240],[210,460],[370,130],[370,280],[370,420],[370,570],[500,350]]};
function dTeam(t){return{name:t?'Rakip':'Takımım',col:t?'#e53935':'#1e88e5',pl:HA.map((h,i)=>({n:i?'Oyuncu '+(i+1):'Kaleci',x:h[0],y:h[1]}))}}
function clean(o,d){try{const r={name:String(o.name||d.name).slice(0,12),col:/^#[0-9a-f]{6}$/i.test(o.col)?o.col:d.col,pl:[]};
 for(let i=0;i<8;i++){const q=o.pl[i]||{},f=d.pl[i];r.pl.push({n:String(q.n||f.n).slice(0,10),x:i?Math.max(65,Math.min(540,+q.x||f.x)):f.x,y:i?Math.max(65,Math.min(635,+q.y||f.y)):f.y})}return r}catch(e){return d}}
function ld(){try{return clean(JSON.parse(localStorage.getItem('fk_team')),dTeam(0))}catch(e){return dTeam(0)}}
let T=[dTeam(0),dTeam(1)],MY=ld(),GT=null,ED=null,dr=-1;
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function team(){ED=JSON.parse(JSON.stringify(MY));edit()}
function edit(){ov('<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start;max-width:760px"><div style="text-align:left"><h2>Takımım</h2>'+
 '<input maxlength="12" value="'+esc(ED.name)+'" oninput="ED.name=this.value" style="width:200px"><div>'+
 COL.map(c=>'<button onclick="ED.col=\''+c+'\';edit()" style="background:'+c+';width:34px;height:34px;padding:0;border:'+(ED.col==c?'3px solid #fff':'0')+'"></button>').join('')+'</div>'+
 ED.pl.map((q,i)=>'<div style="display:flex;gap:6px;align-items:center"><b style="width:18px">'+(i+1)+'</b><input maxlength="10" value="'+esc(q.n)+'" oninput="ED.pl['+i+'].n=this.value;dd()" style="width:150px;font-size:15px;padding:5px 8px"></div>').join('')+'</div>'+
 '<div><canvas id="ec" width="300" height="360" style="border-radius:8px"></canvas><div>'+Object.keys(FM).map(f=>'<button onclick="fm(\''+f+'\')" style="font-size:14px;padding:6px 10px">'+f+'</button>').join('')+'</div><small>Oyuncuları sürükle (kaleci sabit)</small></div></div>'+
 '<div><button onclick="sv2()">Kaydet</button><button onclick="menu()">Vazgeç</button></div>');
 const c=$('ec'),pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*360/r.height]};
 c.onpointerdown=e=>{const[px,py]=pt(e);let b=-1,bd=30;ED.pl.forEach((q,i)=>{if(!i)return;const d=Math.hypot((q.x-50)*.6-px,(q.y-50)*.6-py);if(d<bd){bd=d;b=i}});dr=b;if(b>=0)c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(dr<0)return;const[px,py]=pt(e),q=ED.pl[dr];q.x=Math.max(65,Math.min(540,px/.6+50));q.y=Math.max(65,Math.min(635,py/.6+50));dd()};
 c.onpointerup=c.onpointercancel=()=>{dr=-1};dd()}
function dd(){const c=$('ec');if(!c)return;const x=c.getContext('2d');x.fillStyle='#2e7d32';x.fillRect(0,0,300,360);x.strokeStyle='#fffc';x.lineWidth=2;
 x.strokeRect(1,1,298,358);x.strokeRect(0,90,90,180);x.strokeRect(0,144,33,72);x.beginPath();x.arc(300,180,42,Math.PI/2,Math.PI*1.5);x.stroke();
 x.textAlign='center';x.lineJoin='round';
 ED.pl.forEach((q,i)=>{const px=(q.x-50)*.6,py=(q.y-50)*.6;x.beginPath();x.arc(px,py,12,0,7);x.fillStyle=i?ED.col:'#ffeb3b';x.fill();x.lineWidth=2;x.strokeStyle='#000';x.stroke();
  x.font='bold 13px sans-serif';x.lineWidth=3;x.strokeText(i+1,px,py+5);x.fillStyle='#fff';x.fillText(i+1,px,py+5);
  x.font='10px sans-serif';x.lineWidth=3;x.strokeText(q.n,px,py+25);x.fillText(q.n,px,py+25)})}
function fm(f){FM[f].forEach((p,i)=>{ED.pl[i+1].x=p[0];ED.pl[i+1].y=p[1]});dd()}
function sv2(){ED.name=(ED.name||'').trim()||'Takımım';MY=clean(ED,dTeam(0));try{localStorage.setItem('fk_team',JSON.stringify(MY))}catch(e){}menu()}
function labels(){if(!R)return;for(let i=0;i<16;i++){const G=PM[i],t=i>>3,q=T[t].pl[i%8];G.tm.color.set(i%8==0?0xffeb3b:T[t].col);if(G.lab)G.remove(G.lab);
 const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px sans-serif';x.textAlign='center';x.lineWidth=7;x.strokeStyle='#000c';x.fillStyle='#fff';
 const s=(i%8+1)+' '+q.n;x.strokeText(s,128,44);x.fillText(s,128,44);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));sp.scale.set(64,16,1);sp.position.y=66;sp.renderOrder=5;G.add(sp);G.lab=sp}}
function init(){P=[];for(let t=0;t<2;t++)for(let i=0;i<8;i++){const q=T[t].pl[i],x=t?1100-q.x:q.x,y=t?700-q.y:q.y;P.push({t,i,x,y,vx:0,vy:0,hx:x,hy:y,fx:t?-1:1,fy:0,sl:0,rec:0,cl:0,sx:0,sy:0})}ctrl=[7,15];ch=[0,0];own=-1}
function say(s,sec){banner=s;banT=performance.now()+sec*1000}
function kickoff(t){P.forEach(p=>{p.x=p.hx;p.y=p.hy;p.vx=p.vy=0});ball.x=550;ball.y=350;ball.vx=ball.vy=0;ctrl=[7,15];const q=P[t?15:7];q.x=550+(t?24:-24);q.y=350;q.fx=t?-1:1;q.fy=0;own=q.t*8+q.i;prot=.6;ngr.fill(0);st='dead';dead=1.1;last=t;say('Başla!',1)}
function restart(t,x,y,gk){ball.x=x;ball.y=y;ball.vx=ball.vy=0;let b=null,bd=1e9;
 P.forEach(p=>{if(p.t==t&&(gk?p.i==0:p.i>0)){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}});
 const dx=550-x,dy=350-y,d=Math.hypot(dx,dy)||1;const ux=dx/d,uy=dy/d;ball.x=x+ux*14;ball.y=y+uy*14;b.x=ball.x+ux*24;b.y=ball.y+uy*24;b.fx=-ux;b.fy=-uy;b.vx=b.vy=0;own=b.t*8+b.i;prot=.8;gkT=b.i?0:.7;ngr.fill(0);if(b.i>0)ctrl[t]=own;
 P.forEach(p=>{if(p.t!=t){const e=Math.hypot(p.x-x,p.y-y)||1;if(e<110){p.x=x+(p.x-x)/e*110;p.y=y+(p.y-y)/e*110}}});
 st='dead';dead=.9;last=t}
function goal(t){own=-1;sc[t]++;st='goal';gt=2.3;ko=1-t;say('GOL!  '+sc[0]+' - '+sc[1],2.3)}
function fin(){st='end';const a=sc[0],b=sc[1];rt=a==b?'Berabere!':(a>b?T[0].name+' kazandı!':T[1].name+' kazandı!');say(rt,1e5)}
function chk(){const b=ball;
 if(b.y<PY||b.y>PY+PH){restart(1-last,Math.max(70,Math.min(1030,b.x)),b.y<PY?PY:PY+PH,0);say('Aut',.8);return}
 if(b.x<PX||b.x>PX+PW){const lf=b.x<PX;if(Math.abs(b.y-CY)<GH){goal(lf?1:0);return}
  const d=lf?0:1;if(last==d){restart(1-d,lf?PX:PX+PW,b.y<CY?PY:PY+PH,0);say('Korner',.8)}else{restart(d,lf?110:990,CY,1);say('Kale vuruşu',.8)}}}
function near(t,ex){let r=-1,bd=1e9;for(let i=1;i<8;i++){const q=t*8+i;if(q==ex)continue;const d=Math.hypot(P[q].x-ball.x,P[q].y-ball.y);if(d<bd){bd=d;r=q}}return r}
function has(p){return own==p.t*8+p.i}
function rel(p,dx,dy,s){own=-1;ngr[p.t*8+p.i]=.4;ball.x=p.x+dx*(PR+BR+3);ball.y=p.y+dy*(PR+BR+3);ball.vx=dx*s;ball.vy=dy*s;last=p.t;if(st=='dead')st='play';snd('k')}
function kick(p,pw){if(!has(p)&&Math.hypot(ball.x-p.x,ball.y-p.y)>PR+BR+18)return;
 let dx=p.fx,dy=p.fy;const gx=p.t?PX:PX+PW,gd=Math.hypot(gx-p.x,CY-p.y)||1,ux=(gx-p.x)/gd,uy=(CY-p.y)/gd;
 if(dx*ux+dy*uy>.85){dx=dx*.5+ux*.5;dy=dy*.5+uy*.5;const n=Math.hypot(dx,dy);dx/=n;dy/=n}
 rel(p,dx,dy,380+620*pw)}
function pass(p,dx,dy){if(!has(p)&&Math.hypot(ball.x-p.x,ball.y-p.y)>PR+BR+18)return;
 let b=null,bs=-9;P.forEach(q=>{if(q.t==p.t&&q!==p&&q.i>0){const vx=q.x-p.x,vy=q.y-p.y,dd=Math.hypot(vx,vy)||1,dn=(vx*dx+vy*dy)/dd;if(dn>.4){const s=dn-dd/1500;if(s>bs){bs=s;b=q}}}});
 let ux=dx,uy=dy,sp=400;
 if(b){const vx=b.x+b.vx*.3-p.x,vy=b.y+b.vy*.3-p.y,dd=Math.hypot(vx,vy)||1;ux=vx/dd;uy=vy/dd;sp=Math.min(780,dd*2.2+170);ctrl[p.t]=p.t*8+b.i}
 rel(p,ux,uy,sp)}
function ctl(t,dt){const I=t?I1:L,c=P[ctrl[t]],m=Math.hypot(I.mx,I.my);
 if(c.sl>0){c.vx=c.sx*420;c.vy=c.sy*420;c.sl-=dt;if(c.sl<=0)c.rec=.5}
 else{let tx=0,ty=0;const f=c.rec>0?.3:1;
  if(m>.15){const s=Math.min(1,m);tx=I.mx/m*SPD*s*f;ty=I.my/m*SPD*s*f;c.fx=I.mx/m;c.fy=I.my/m}
  const a=Math.min(1,dt*10);c.vx+=(tx-c.vx)*a;c.vy+=(ty-c.vy)*a;
  if(I.sh)ch[t]=Math.min(1,ch[t]+dt/.8);else if(prev[t]){kick(c,ch[t]);ch[t]=0}
  prev[t]=I.sh;
  if(I.pass){I.pass=0;if(m>.3)pass(c,I.mx/m,I.my/m);else pass(c,c.fx,c.fy)}
  if(I.sl){I.sl=0;if(c.cl<=0&&c.rec<=0&&!has(c)){c.sl=.45;c.sx=c.fx;c.sy=c.fy;c.cl=1.3}}}
 I.pass=0;I.sl=0;
 const mine=own>=0&&P[own].t==t;
 if(I.sw){I.sw=0;if(!mine){ctrl[t]=near(t,ctrl[t]);cd[t]=.5}}
 else if(!mine){cd[t]-=dt;const n=near(t,-1),d1=Math.hypot(c.x-ball.x,c.y-ball.y);
  if(n!=ctrl[t]&&cd[t]<=0&&d1>120&&d1-Math.hypot(P[n].x-ball.x,P[n].y-ball.y)>60){ctrl[t]=n;cd[t]=.5}}}
function ai(dt){for(let t=0;t<2;t++){let c2=-1,bd=1e9;
 for(let i=1;i<8;i++){const q=t*8+i;if(q==ctrl[t])continue;const d=Math.hypot(P[q].x-ball.x,P[q].y-ball.y);if(d<bd){bd=d;c2=q}}
 const cdist=Math.hypot(P[ctrl[t]].x-ball.x,P[ctrl[t]].y-ball.y);
 for(let i=0;i<8;i++){const q=t*8+i;if(q==ctrl[t])continue;const p=P[q];let tx,ty,sp=SPD*.8;
  if(i==0){const gx=t?1015:85;tx=gx;ty=Math.max(CY-70,Math.min(CY+70,ball.y));const d=Math.hypot(ball.x-gx,ball.y-CY);if(d<170){tx=gx+(t?-1:1)*Math.min(60,d*.4);ty=ball.y}}
  else if(q==c2&&bd<300&&cdist>50){tx=ball.x;ty=ball.y;sp=SPD*.9}
  else{tx=p.hx+(ball.x-550)*.4;ty=p.hy+(ball.y-CY)*.3}
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),s=Math.min(sp,d*4),vx=d>2?dx/d*s:0,vy=d>2?dy/d*s:0,a=Math.min(1,dt*8);
  p.vx+=(vx-p.vx)*a;p.vy+=(vy-p.vy)*a}}}
function phys(dt){
 P.forEach(p=>{p.x=Math.max(PX+PR,Math.min(PX+PW-PR,p.x+p.vx*dt));p.y=Math.max(PY+PR,Math.min(PY+PH-PR,p.y+p.vy*dt))});
 for(let a=0;a<16;a++)for(let b=a+1;b<16;b++){const p=P[a],q=P[b],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
  if(d<PR*2&&d>.01){const o=(PR*2-d)/2,nx=dx/d,ny=dy/d;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o}}

 if(own>=0){const p=P[own];ball.x=p.x+p.fx*24;ball.y=p.y+p.fy*24;ball.vx=p.vx;ball.vy=p.vy;
  if(p.i==0){if(st=='play'){gkT-=dt;if(gkT<=0){const tx=550-p.x,ty=(Math.random()-.5)*300,n=Math.hypot(tx,ty);rel(p,tx/n,ty/n,560)}}}
  else if(st=='play'){
   const nx=ball.x<PX+6?1:ball.x>PX+PW-6?-1:0,ny=ball.y<PY+6?1:ball.y>PY+PH-6?-1:0;
   if(nx||ny){own=-1;ngr[p.t*8+p.i]=.3;ball.x=Math.max(PX+7,Math.min(PX+PW-7,ball.x));ball.y=Math.max(PY+7,Math.min(PY+PH-7,ball.y));ball.vx=nx*280+p.vx*.3;ball.vy=ny*280+p.vy*.3;snd('k')}
   else for(let q=0;q<16;q++){const o=P[q];if(o.t!=p.t){const d=Math.hypot(o.x-ball.x,o.y-ball.y);if((prot<=0&&d<PR+BR+2)||(o.sl>0&&d<PR+BR+18)){steal(q);break}}}}}
 else if(st=='play')P.forEach((p,q)=>{if(ngr[q]>0||own>=0)return;const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
  if(d<PR+BR+4&&d>.01){const sp=Math.hypot(ball.vx,ball.vy),mate=p.t==last;
   if(sp<(p.i==0?700:mate?1000:500)){own=q;prot=.8;last=p.t;gkT=.7;ball.vx=ball.vy=0;if(p.i>0)ctrl[p.t]=q;ch[p.t]=0}
   else if(d<PR+BR){const nx=dx/d,ny=dy/d;ball.x=p.x+nx*(PR+BR);ball.y=p.y+ny*(PR+BR);
    if(p.i==0){const tx=550-p.x,ty=(Math.random()-.5)*300,n=Math.hypot(tx,ty);ball.vx=tx/n*560;ball.vy=ty/n*560}
    else{const vr=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;if(vr<0){ball.vx-=1.35*vr*nx;ball.vy-=1.35*vr*ny}}
    last=p.t}}})
}
function steal(q){const o=P[q];if(own>=0)ngr[own]=.5;own=q;prot=.8;last=o.t;gkT=.7;if(o.i)ctrl[o.t]=q;ch[0]=ch[1]=0;o.sl=0;snd('k')}
function bmove(dt,ig){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const f=Math.pow(.42,dt);ball.vx*=f;ball.vy*=f;
 if(ig){ball.x=Math.max(16,Math.min(1084,ball.x));ball.y=Math.max(CY-GH,Math.min(CY+GH,ball.y))}}
function step(dt){
 if(st=='goal'){bmove(dt,1);gt-=dt;if(gt<=0){if(cfg.m=='g'&&Math.max(sc[0],sc[1])>=cfg.v)fin();else kickoff(ko)}return}
 if(st=='end')return;
 clock+=cfg.m=='t'?-dt:dt;
 if(cfg.m=='t'&&clock<=0&&st=='play'){clock=0;fin();return}
 if(st=='dead'){dead-=dt;if(dead<=0)st='play'}
